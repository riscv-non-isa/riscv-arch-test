# yaml-language-server: $schema=testplan.schema.json
suite: Sv_Sm_satp
source: https://docs.google.com/spreadsheets/d/1LGwD2e01j4SN9tg85nt6gPwpp7nXyXMF7hqbw3jvXko/edit?gid=669910453#gid=669910453
coverpoints:
  - heading: "General Test Environment (Sv_Sm):\n- Sm suite: boots to M-mode (BOOT_TO_MMODE) because each coverpoint needs M-mode state (mstatus.MPRV/MPP, mstatus.TVM, mstatus.SBE or an M-mode CSR access). Mode changes use RVTEST_TSBI_GOTO_*.\n- These coverpoints were split out of Sv. Faults taken in M-mode are sampled from mcause.\n- Run for every supported translation mode: Sv32 on RV32; Sv39, Sv48 and Sv57 on RV64, as selected by the UDB configuration.\n- Split from Sv: the M-mode half of cp_access_m_s (now cp_access_m) and all of Sv_mstatus_mprv_cg."
  - name: cp_access_m
    goal: Verify satp is readable and writable from M-mode with csrrw, csrrs and csrrc
    description: "Sv32 and Sv39 configurations, M-mode: csrrw satp with 1, csrrs with 2, csrrc with 1, reading satp back after each; and the same three accesses with satp = 0 while mstatus.TVM=1, which does not restrict M-mode."
    expectation: No exception; each read returns the value produced by the write.
    bins: |-
      cp_ins x Mcause x tvm_mstatus x mode {M-mode}
      = 6 bins on RV64, 6 on RV32
    id: satp_sz satp_acc satp_op satp_mode
    rules:
      - "[norm:satp_sz] [norm:satp_acc] [norm:satp_op] [norm:satp_mode]"
