# yaml-language-server: $schema=testplan.schema.json
suite: ExceptionsHV
source: https://docs.google.com/spreadsheets/d/1DWBEoprndjQzLTXQTzPI8jW1HydtkYRR3tg58q59fdk/edit?gid=552219666#gid=552219666
coverpoints:
  - name: |-
      cp_mstatus_vs_off
      cp_vsstatus_vs_off
    goal: mstatus.VS and vsstatus.VS are selected correctly according to the privilege level to disable vector instructions when off.
    description: Set misa.V to 1.  Cross mstatus.VS = {00, 01, 10, 11}, vsstatus.vs = {00, 01 10, 11}, mode = {M/HS/VS/VU/U}.  Attempt csrr t0, vl and vadd.vv v1, v2, v3.  Read back mstatus.VS and vssstatus.VS.
    expectation: Illegal instruction if mstatus.VS = 00 or ((mode = VS or VU) and vsstatus.VS = 00).  Otherwise, vadd.vv sets mstatus.VS to 11, and also sets vsstatus.VS to 11 if mode = VS or VU.
    bins: 4 * 4 * 5
    rules:
      - vsstatus_vs_mstatus_vs_op_off
      - vsstatus_vs_op
  - name: cp_misa_V
    goal: vector instructions don't work when misa.V = 0
    description: Set misa.V to 0.  Attempt vadd.vv.
    expectation: Illegal instruction if V is not hardwired to 1
    bins: "1"
    notes: |-
      ins.prev = csrw misa x0; ins.current = vadd.v
