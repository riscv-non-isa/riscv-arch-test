# yaml-language-server: $schema=testplan.schema.json
suite: ZawrsH
notes: |
  Zawrs interaction with the H extension. The suite runs WRS in VS/VU mode.
  Multi-hart reservation invalidation is outside the single-hart Sail model.
coverpoints:
  - heading: VS/VU completion without a valid reservation
  - name: cp_wrs_no_res_h
    goal: WRS completes immediately when no reservation is valid
    description: |-
      Cross VS/VU mode, WRS.NTO/WRS.STO, mstatus.TW={0/1}, and hstatus.VTW={0/1}.
      SC.W clears any prior reservation before WRS.
    expectation: no exception and zero change in the trap count
    bins: 2 x 2 x 2 x 2 = 16 bins
    rules:
      - Zawrs_wrs-no-reservation
  - heading: WRS.STO short timeout
  - name: cp_wrs_sto_timeout_h
    goal: WRS.STO is not controlled by TW or VTW
    description: |-
      Establish a reservation with LR.W, then execute WRS.STO in VS/VU mode.
      Cross mstatus.TW={0/1} and hstatus.VTW={0/1}.
    expectation: WRS.STO retires normally after its short timeout
    bins: 2 x 2 x 2 = 8 bins
    rules:
      - Zawrs_wrs-sto_stall_duration
  - heading: WRS.NTO controlled by hstatus.VTW
  - name: cp_wrs_nto_vtw_h
    goal: VTW causes a virtual-instruction exception
    description: |-
      Establish a reservation and execute WRS.NTO in VS/VU mode with
      mstatus.TW=0, hstatus.VTW=1, and hedeleg[2]=0.
    expectation: virtual-instruction exception, cause 22, handled in HS-mode
    bins: 2 bins
    rules:
      - Zawrs_virtual_instr_excp
  - heading: WRS.NTO controlled by mstatus.TW
  - name: cp_wrs_nto_tw_h
    goal: TW takes priority over VTW and illegal-instruction delegation is honored
    description: |-
      Establish a reservation and execute WRS.NTO in VS/VU mode with
      mstatus.TW=1. Cross hstatus.VTW={0/1} and hedeleg[2]={0/1}.
      The environment's standard medeleg[2] setting delegates illegal instruction
      to HS. Local HS and VS trap entries record scause so the exception cause and
      hedeleg-selected destination are both checked in the signature.
    expectation: illegal-instruction exception, cause 2; hedeleg[2] selects HS or VS handling
    bins: 2 x 2 x 2 x 2 = 8 bins
    rules:
      - Zawrs_priv_illegal_instr_excp
  - heading: Pending guest interrupt
  - name: cp_wrs_interrupt_h
    goal: A pending locally-enabled interrupt terminates a VS-mode WRS wait
    description: |-
      Establish a reservation, delegate and inject VSSIP, enable vsie.SSIE,
      and keep vsstatus.SIE=0. Cross WRS.NTO/WRS.STO, mstatus.TW={0/1},
      and hstatus.VTW={0/1}.
    expectation: WRS retires without taking the globally-disabled interrupt; sip.SSIP remains pending
    bins: 2 x 2 x 2 = 8 bins
    rules:
      - Zawrs_exec_resume_rules
