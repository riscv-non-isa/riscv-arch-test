# yaml-language-server: $schema=testplan.schema.json
suite: SdtrigH
description: |
  SdtrigH boots to HS-mode and enters VS-mode and VU-mode from HS-mode
  Unless otherwise specified, arm triggers through T-SBI, with tdata1.vs or tdata1.vu = 1 for the guest mode under test
  While a guest runs, medeleg[3] = hedeleg[3] = 1 (breakpoints from the guest are taken into VS-mode) and vsstatus.SIE = 1, so the re-entrancy rule does not suppress VS-mode triggers
  itrigger and etrigger are armed in M-mode with medeleg[3] = 0, so a breakpoint on an SSI or a virtual-instruction exception taken from the guest into HS-mode is taken into M-mode
  The textra cases arm an icount trigger with count = 1, whose breakpoint is taken on a marker instruction (addi x0, x0, 0x5a)
  satp, vsatp and hgatp never select Bare with a nonzero ASID or VMID, which is UNSPECIFIED
  All other assumptions are inherited from SdtrigSm
coverpoints:
  - heading: Mode bits (SdtrigH_mcontrol6_cg, SdtrigH_icount_cg, SdtrigH_itrigger_cg, SdtrigH_etrigger_cg)
  - name: |-
      cp_mcontrol6_vs
      cp_mcontrol6_vu
    goal: An mcontrol6 trigger fires in VS-mode (VU-mode) only when its vs (vu) bit is set
    description: |-
      For each of UDB_SDTRIG_NUM_TRIGGERS in tselect:
      mcontrol6 store address trigger on scratch (select = 0, XSL = 010)
      tdata1 = {vs (vu) only, every other mode bit (m, s, u, and vu (vs))}
      sw to scratch in VS-mode (VU-mode)
    expectation: |-
      Breakpoint exception taken into VS-mode when only tdata1.vs (vu) = 1
      No breakpoint when only the other mode bits are set
    bins: NUM_TRIGGERS * 2 per mode
  - name: |-
      cp_icount_vs
      cp_icount_vu
    goal: An icount trigger counts and fires in VS-mode (VU-mode) only when its vs (vu) bit is set
    description: |-
      For each of UDB_SDTRIG_NUM_TRIGGERS in tselect:
      icount trigger with count = 1
      tdata1 = {vs (vu) only, every other mode bit (m, s, u, and vu (vs))}
      execute a nop and the marker in VS-mode (VU-mode)
    expectation: |-
      Breakpoint exception taken into VS-mode on the marker when only tdata1.vs (vu) = 1
      No breakpoint when only the other mode bits are set
    bins: NUM_TRIGGERS * 2 per mode
  - name: |-
      cp_itrigger_vs
      cp_itrigger_vu
    goal: An itrigger fires on an interrupt taken from VS-mode (VU-mode) only when its vs (vu) bit is set
    description: |-
      In M-mode, with medeleg[3] = 0, for each of UDB_SDTRIG_NUM_TRIGGERS in tselect:
      itrigger with tdata2 = SSI, mie.SSIE = 1
      tdata1 = {vs (vu) only, every other mode bit (m, s, u, and vu (vs))}
      set mip.SSIP and enter VS-mode (VU-mode); the SSI is taken from the guest into HS-mode
    expectation: |-
      Breakpoint exception taken into M-mode before the first HS handler instruction when only tdata1.vs (vu) = 1
      No breakpoint when only the other mode bits are set
    bins: NUM_TRIGGERS * 2 per mode
  - name: |-
      cp_etrigger_vs
      cp_etrigger_vu
    goal: An etrigger fires on an exception taken from VS-mode (VU-mode) only when its vs (vu) bit is set
    description: |-
      In M-mode, with medeleg[3] = 0, for each of UDB_SDTRIG_NUM_TRIGGERS in tselect:
      etrigger with tdata2 = virtual instruction (22)
      tdata1 = {vs (vu) only, every other mode bit (m, s, u, and vu (vs))}
      enter VS-mode (VU-mode) and read hstatus, which raises a virtual-instruction exception taken into HS-mode
    expectation: |-
      Breakpoint exception taken into M-mode before the first HS handler instruction when only tdata1.vs (vu) = 1
      No breakpoint when only the other mode bits are set
    bins: NUM_TRIGGERS * 2 per mode
  - heading: textra (SdtrigH_textra_cg)
  - name: cp_textra_mctx_sel
    goal: mhselect = 1 and 5 match {mhvalue, mhselect[2]} against mcontext in VS-mode and VU-mode
    description: |-
      If mcontext is implemented, in VS-mode and VU-mode, for an even and an odd mcontext (written through T-SBI):
      for each of UDB_SDTRIG_NUM_TRIGGERS in tselect, icount trigger (count = 1) with tdata3 =
      {mhselect matching mcontext[0] with mhvalue = mcontext >> 1, the other mhselect, the matching mhselect with mhvalue bit 0 flipped}
    expectation: Breakpoint only when {mhvalue, mhselect[2]} equals the low 7 (RV32) or 14 (RV64) bits of mcontext
    bins: 2 modes * NUM_TRIGGERS * 2 mhselect * (match and fired, mismatch and not fired)
  - name: cp_textra_vmid_sel
    goal: mhselect = 2 and 6 match {mhvalue, mhselect[2]} against hgatp.VMID in VS-mode and VU-mode
    description: |-
      With hgatp = Sv39x4 (RV64) or Sv32x4 (RV32) identity mapping the test image, and VMID = 2^VMIDLEN-2, then 2^VMIDLEN-1:
      in VS-mode and VU-mode, for each of UDB_SDTRIG_NUM_TRIGGERS in tselect, icount trigger (count = 1) with tdata3 =
      {mhselect matching VMID[0] with mhvalue = VMID >> 1, the other mhselect, the matching mhselect with mhvalue bit 0 flipped}
    expectation: Breakpoint only when {mhvalue, mhselect[2]} equals hgatp.VMID
    bins: 2 modes * NUM_TRIGGERS * 2 mhselect * (match and fired, mismatch and not fired)
  - name: cp_textra_vsatp_asid
    goal: sselect = 2 matches svalue against vsatp.ASID in VS-mode and VU-mode
    description: |-
      With vsatp = Sv39 (RV64) or Sv32 (RV32) identity mapping the test image and ASID X = 2^ASIDLEN-2 (satp = Bare, ASID 0):
      in VS-mode and VU-mode, for each of UDB_SDTRIG_NUM_TRIGGERS in tselect, icount trigger (count = 1) with sselect = 2 and
      svalue = {X, 0, X ^ 1, X | (1 << ASIDMAX)}
    expectation: Breakpoint only when the low ASIDMAX bits of svalue equal vsatp.ASID (X and X | (1 << ASIDMAX))
    bins: 2 modes * NUM_TRIGGERS * (match and fired, mismatch and not fired)
  - heading: hcontext and scontext (SdtrigH_context_cg)
  - name: |-
      cp_hcontext_hs
      cp_hcontext_m
    goal: hcontext is an alias of the hcontext field of mcontext, accessible in HS-mode and M-mode
    description: |-
      If hcontext is implemented:
      in HS-mode, csrw hcontext with all ones and a random value and read hcontext and mcontext (T-SBI); write mcontext (T-SBI) and read hcontext
      in M-mode, csrw hcontext and read mcontext and hcontext
      Reads are checked in the low UDB_DBG_HCONTEXT_WIDTH bits
    expectation: hcontext and mcontext read the value written through either name
    bins: 2 (csrr, csrw) per mode
  - name: cp_context_access
    goal: hcontext is accessible only in M-mode and HS-mode; scontext also in VS-mode
    description: Read scontext and hcontext in HS-mode, VS-mode and VU-mode with every mstateen0 and hstateen0 bit set (boot)
    expectation: |-
      Both reads succeed in HS-mode
      In VS-mode the scontext read succeeds and the hcontext read raises a virtual-instruction exception
      In VU-mode both reads raise a virtual-instruction exception
    bins: 3 modes * 2 CSRs
  - name: |-
      cp_hs_context_stateen
      cp_vs_context_stateen
      cp_vu_context_stateen
    goal: mstateen0.CONTEXT controls access to scontext and hcontext below M-mode, and hstateen0.CONTEXT controls VS-mode access to scontext
    description: |-
      If Smstateen is implemented, for (mstateen0.CONTEXT, hstateen0.CONTEXT) = {(0, 0), (1, 0), (1, 1)}:
      read scontext and hcontext in HS-mode, VS-mode and VU-mode
    expectation: |-
      Illegal instruction when mstateen0.CONTEXT = 0
      Otherwise HS-mode reads succeed; in VS-mode hcontext raises virtual instruction, and scontext raises virtual instruction when hstateen0.CONTEXT = 0;
      in VU-mode both raise virtual instruction
    bins: 2 CSRs * 3 stateen states per mode
