# yaml-language-server: $schema=testplan.schema.json
suite: SsstateenH
source: https://docs.google.com/spreadsheets/d/1DWBEoprndjQzLTXQTzPI8jW1HydtkYRR3tg58q59fdk/edit?gid=311784014#gid=311784014
notes: |
  SsstateenH boots to HS-mode.  It first sets mstateen0 and hstateen0 to enable only SE0, ENVCFG, JVT and FCSR
  (with Zfinx), the state these suites control, and enters VS-mode and VU-mode from HS-mode.  hstateen0 controls
  VS-mode and VU-mode access but not HS-mode access.  An access that only hstateen0 forbids raises a
  virtual-instruction exception, and so does any VU-mode access to an S or H CSR that HS-mode could make.
  On RV32, SE0 and ENVCFG are in hstateen0h.  Each read that traps records 42 and the trap.
coverpoints:
  - heading: HS-mode (SsstateenH_hs_cg)
  - name: cp_hs_hstateen0_walk
    goal: hstateen0 is writable from HS-mode
    description: Walk a 1 and a 0 through hstateen0 (and hstateen0h on RV32) in HS-mode with csrrs and csrrc, and read each value back.  C is left out of the check because custom state is optional.
    expectation: Bits whose mstateen0 bit is 0, or whose state the hart lacks, are read-only zero
    bins: csrrs/csrrc * hstateen0 (and hstateen0h) * XLEN walking ones
  - name: cp_hs_sstateen0
    goal: hstateen0.SE0 does not control HS-mode
    description: Read sstateen0 in HS-mode with hstateen0.SE0 = 0 and 1
    expectation: Both reads succeed
    bins: 2 hstateen0.SE0
  - name: cp_hs_senvcfg
    goal: hstateen0.ENVCFG does not control HS-mode
    description: Read senvcfg in HS-mode with hstateen0.ENVCFG = 0 and 1
    expectation: Both reads succeed
    bins: 2 hstateen0.ENVCFG
  - name: cp_hs_stateen123
    goal: Bit 63 of mstateen1-3 controls HS-mode access to sstateen1-3 and hstateen1-3
    description: Read sstateen1-3 and hstateen1-3 (and hstateen1h-3h on RV32) in HS-mode
    expectation: Illegal instruction when bit 63 of the matching mstateen CSR is 0, else the read succeeds
    bins: 6 CSRs (9 on RV32)
  - heading: VS-mode (SsstateenH_vs_cg)
  - name: cp_vs_sstateen0
    goal: hstateen0.SE0 controls VS-mode access to sstateen0
    description: Read sstateen0 in VS-mode with hstateen0.SE0 = 0 and 1
    expectation: Virtual instruction when hstateen0.SE0 = 0, else the read succeeds
    bins: 2 hstateen0.SE0
  - name: cp_vs_senvcfg
    goal: hstateen0.ENVCFG controls VS-mode access to senvcfg
    description: Read senvcfg in VS-mode with hstateen0.ENVCFG = 0 and 1
    expectation: Virtual instruction when hstateen0.ENVCFG = 0, else the read succeeds
    bins: 2 hstateen0.ENVCFG
  - name: cp_vs_stateen123
    goal: Bit 63 of mstateen1-3 and hstateen1-3 controls VS-mode access
    description: Read sstateen1-3 and hstateen1-3 (and hstateen1h-3h on RV32) in VS-mode
    expectation: Illegal instruction when bit 63 of the matching mstateen CSR is 0.  Otherwise virtual instruction for hstateen1-3, and for sstateen1-3 when bit 63 of the matching hstateen CSR is 0; else the sstateen read succeeds
    bins: 6 CSRs (9 on RV32)
  - name: cp_vs_hstateen0
    goal: hstateen0 is never accessible from VS-mode
    description: Read hstateen0 (and hstateen0h on RV32) in VS-mode
    expectation: Virtual instruction, because HS-mode could read it
    bins: 1 CSR (2 on RV32)
  - name: cp_vs_sstateen0_roz
    goal: sstateen0 bits whose hstateen0 bit is 0 read as zero in VS-mode
    description: With hstateen0.SE0 = 1, write all 1s to sstateen0 in HS-mode, then read sstateen0 in VS-mode with hstateen0.C, FCSR and JVT all clear and all set
    expectation: sstateen0 bits whose hstateen0 bit is 0 read as zero
    bins: hstateen0 C/FCSR/JVT zero, and nonzero when Zcmt or Zfinx makes one of them writable
  - heading: VU-mode (SsstateenH_vu_cg)
  - name: cp_vu_sstateen0
    goal: sstateen0 is not accessible from VU-mode
    description: Read sstateen0 in VU-mode with hstateen0.SE0 = 0 and 1
    expectation: Always virtual instruction
    bins: 2 hstateen0.SE0
  - name: cp_vu_senvcfg
    goal: senvcfg is not accessible from VU-mode
    description: Read senvcfg in VU-mode with hstateen0.ENVCFG = 0 and 1
    expectation: Always virtual instruction
    bins: 2 hstateen0.ENVCFG
  - name: cp_vu_stateen123
    goal: sstateen1-3 and hstateen1-3 are not accessible from VU-mode
    description: Read sstateen1-3 and hstateen1-3 (and hstateen1h-3h on RV32) in VU-mode
    expectation: Virtual instruction when HS-mode could make the access (bit 63 of the matching mstateen CSR is 1), else illegal instruction
    bins: 6 CSRs (9 on RV32)
  - name: cp_vu_hstateen0
    goal: hstateen0 is not accessible from VU-mode
    description: Read hstateen0 (and hstateen0h on RV32) in VU-mode
    expectation: Virtual instruction, because HS-mode could read it
    bins: 1 CSR (2 on RV32)
