# yaml-language-server: $schema=testplan.schema.json
suite: Sstvala
source: https://docs.google.com/spreadsheets/d/10NX0T4MgueqA4p7JNg4whCq2k3YZ9R73UCV88MtcIUA/edit?gid=691634508#gid=691634508
coverpoints:
  - heading: All tests take place in S-mode with exceptions delegated to S-mode.
  - name: cp_stval_load_page_fault
    goal: stval is written with faulting VA
    description: With VM enabled, cause load page fault.
    expectation: fault, stval written with VA
    bins: "1"
    rules:
      - Sstvala_stval_faulting_vaddr
  - name: cp_stval_store_page_fault
    goal: stval is written with faulting VA
    description: With VM enabled, cause store page fault.
    expectation: fault, stval written with VA
    bins: "1"
  - name: cp_stval_instr_page_fault
    goal: stval is written with faulting VA
    description: With VM enabled, cause instruction page fault.
    expectation: fault, stval written with VA
    bins: "1"
    rules:
      - Sstvala_stval_faulting_vaddr
  - name: cp_load_access_fault
    goal: stval is written with faulting VA
    description: load from an illegal address
    expectation: fault, stval written with VA
    bins: "1"
    rules:
      - Sstvala_stval_faulting_vaddr
  - name: cp_store_access_fault
    goal: stval is written with faulting VA
    description: store to an illegal address
    expectation: fault, stval written with VA
    bins: "1"
    rules:
      - Sstvala_stval_faulting_vaddr
  - name: cp_instr_access_fault
    goal: stval is written with faulting VA
    description: jump to an illegal address
    expectation: fault, stval written with VA
    bins: "1"
    rules:
      - Sstvala_stval_faulting_vaddr
  - name: cp_load_address_misaligned
    goal: stval is written with faulting VA if misaligned fault occurs
    description: lw with misaligned address
    expectation: succeed, or fault with stval containing address
    rules:
      - Sstvala_stval_faulting_vaddr
  - name: cp_store_address_misaligned
    goal: stval is written with faulting VA if misaligned fault occurs
    description: sw with misaligned address
    expectation: succeed, or fault with stval containing address
    rules:
      - Sstvala_stval_faulting_vaddr
  - name: cp_instr_adr_misaligned_jalr
    goal: stval is written with faulting VA if misaligned fault occurs
    description: jalr with misaligned address
    expectation: succeed, or fault with stval containing address
    rules:
      - Sstvala_stval_faulting_vaddr
  - name: cp_illegal_instruction
    goal: stval is written with the illegal instruction
    description: Execute 0xFFFFFFFF, 0x00000000
    expectation: Illegal instruction fault with stval = 0xFFFFFFFF, 0x00000000
    bins: "2"
    rules:
      - Sstvala_stval_faulting_instruction
  - heading: "Note: breakpoints tested in SstvalaSdtrig because they are generated with debug triggers"
