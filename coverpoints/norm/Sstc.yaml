normative_rule_definitions:
  # This extension adds the S-level stimecmp CSR
  - name: stimecmp_exist
    coverpoint: ["Sstc_cg/{cp_supervisor_stce, cp_supervisor_tm}"]
  # This extension adds the STCE bit to the menvcfg and henvcfg CSRs.
  - name: stce_bit_exist
    coverpoint: ["Sstc_cg/{cp_supervisor_stce, cp_user_stce, cp_vs_stimecmp}"]

  # menvcfg_stce_exists and menvcfg_stce_rdonly0 are mapped in Sm.yaml (menvcfg walk).

  # The STCE bit enables stimecmp for S-mode when set to one.
  - name: menvcfg_stce_enable_op
    coverpoint:
      ["Sstc_cg/cp_supervisor_stce", "InterruptsSm_cg/cp_trigger_sti_sstc"]
  # When this extension is implemented and STCE in menvcfg is zero, an attempt to access
  # stimecmp or vstimecmp in a mode other than M-mode raises an illegal-instruction
  # exception, STCE in henvcfg is read-only zero, and STIP in mip and sip reverts to its
  # defined behavior as if this extension is not implemented.
  - name: menvcfg_stce_zero_op
    # cp_trigger_sti_sstc covers the STIP half with STCE = 0; the stce_pair of the H crosses never reaches
    # henvcfg.STCE = 1 with menvcfg.STCE = 0
    coverpoint:
      [
        "Sstc_cg/{cp_supervisor_stce, cp_user_stce, cp_supervisor_vstimecmp, cp_vs_stimecmp, cp_vu_stimecmp}",
        "InterruptsSm_cg/cp_trigger_sti_sstc",
      ]
  # Further, if the H extension is implemented, then hip.VSTIP also reverts its defined
  # behavior as if this extension is not implemented.
  - name: menvcfg_stce_zero_vstip
    coverpoint: ["SstcSm_cg/cp_vstip"]

  # when the TM bit in the mcounteren register is clear, attempts to access the
  # stimecmp or vstimecmp register while executing in a mode less privileged than M
  # will cause an illegal-instruction exception.
  - name: mcounteren_tm_clr
    # U-mode accesses to stimecmp trap whatever TM is, so only S-mode, HS-mode and VS-mode exercise TM
    coverpoint:
      [
        "Sstc_cg/{cp_supervisor_tm, cp_supervisor_vstimecmp, cp_vs_stimecmp, cp_vu_stimecmp}",
      ]

  # When this bit is set, access to the stimecmp or vstimecmp register is permitted
  # in S-mode if implemented, and access to the vstimecmp register (via stimecmp) is
  # permitted in VS-mode if implemented and not otherwise prevented by the TM bit in
  # hcounteren.
  - name: mcounteren_tm_set
    coverpoint:
      ["Sstc_cg/{cp_supervisor_tm, cp_supervisor_vstimecmp, cp_vs_stimecmp}"]

  # The stimecmp CSR is a 64-bit register and has 64-bit precision on all RV32 and
  # RV64 systems. In RV32 only, accesses to the stimecmp CSR access the low 32 bits,
  # while accesses to the stimecmph CSR access the high 32 bits of stimecmp.
  - name: stimecmp_stimecmph_sz_acc
    coverpoint:
      [
        "Sstc_cg/cp_supervisor_tm",
        "Sstc_cg/cp_supervisor_tm_h",
        "Sstc_cg/cp_supervisor_stce",
      ]

  # mip_sip_stip_op and sip_stip_sie_stie are mapped in SstcSm.yaml (InterruptsSm_cg).

  # and the VS-level vstimecmp CSR
  - name: vstimecmp_exist
    coverpoint: ["Sstc_cg/{cp_supervisor_vstimecmp, cp_vs_stimecmp}"]

  # The Sstc extension adds the STCE (STimecmp Enable) bit to henvcfg CSR. When the Sstc
  # extension is not implemented, STCE is read-only zero. The STCE bit enables vstimecmp for
  # VS-mode when set to one. When STCE bit is henvcfg is zero, an attempt to access stimecmp
  # (really vstimecmp) when V=1 raises a virtual-instruction exception, and VSTIP in hip reverts
  # to its defined behavior as if this extension is not implemented.
  - names: [henvcfg_stce, henvcfg_stce_op, henvcfg_stce_zero_op]
    coverpoint:
      ["Sstc_cg/{cp_vs_stimecmp, cp_vs_stimecmp_write}", "SstcSm_cg/cp_vstip"]
  # henvcfg.STCE is read-only zero without Sstc
  - name: henvcfg_stce_rdonly0
    # needs an H implementation without Sstc
    coverpoint: [""]

  # In addition, when the TM bit in the hcounteren register is clear, attempts to access the
  # vstimecmp register (via stimecmp) while executing in VS-mode will cause a
  # virtual-instruction exception if the same bit in mcounteren is set. When this bit and the
  # same bit in mcounteren are both set, access to the vstimecmp register (if implemented) is
  # permitted in VS-mode.
  - name: hcounteren_acc
    coverpoint: ["Sstc_cg/{cp_vs_stimecmp, cp_vs_stimecmp_write}"]

  # The vstimecmp CSR is a 64-bit register and has 64-bit precision on all RV32 and RV64
  # systems. In RV32 only, accesses to the vstimecmp CSR access the low 32 bits, while accesses
  # to the vstimecmph CSR access the high 32 bits of vstimecmp.
  - names: [vstimecmp_sz, vstimecmp_acc]
    coverpoint:
      ["Sstc_cg/{cp_supervisor_vstimecmp_write, cp_vs_stimecmp_write}"]

  # When V=1, an attempt to read or write a VS CSR directly by its own separate CSR address
  # causes a virtual-instruction exception.
  - name: H_vscsrs_acc_vs
    coverpoint: ["Sstc_cg/cp_vs_vstimecmp"]
  # in VS-mode or VU-mode, attempts to access an implemented non-high-half hypervisor CSR or VS
  # CSR when the same access (read/write) would be allowed in HS-mode, assuming mstatus.TVM=0;
  # and the same for the high halves when XLEN=32
  - names:
      [
        H_virtinst_vu_vs_nonhigh_allowedhs_tvm0,
        H_virtinst_vu_vs32_high_allowedhs_tvm0,
      ]
    coverpoint: ["Sstc_cg/{cp_vs_vstimecmp, cp_vu_vstimecmp}"]
  # in VU-mode, attempts to access an implemented non-high-half supervisor CSR when the same
  # access (read/write) would be allowed in HS-mode, assuming mstatus.TVM=0; and the same for
  # the high halves when XLEN=32
  - names:
      [
        H_virtinst_vu_nonhigh_supervisor_allowedhs_tvm0,
        H_virtinst_vu32_high_supervisor_allowedhs_tvm0,
      ]
    coverpoint: ["Sstc_cg/cp_vu_stimecmp"]
  # U-mode accesses to VS CSRs raise illegal instruction
  - name: H_vscsrs_acc_u
    coverpoint: ["Sstc_cg/cp_user_vstimecmp"]

  # The interrupt will be taken based on the standard interrupt enable and delegation rules
  # while V=1. The hip.VSTIP bit remains defined while V=0 as well as V=1.
  - names: [hip_vstip_enable, hip_vstip_defined_v0]
    coverpoint: ["Sstc_cg/cp_vstimecmp_int", "SstcSm_cg/cp_vstimecmp_int"]
