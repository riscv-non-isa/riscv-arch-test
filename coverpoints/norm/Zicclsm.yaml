# Mapping of normative rules to coverpoints for a test suite
#
# Zicclsm (Main Memory Misaligned Accesses) has a single normative rule. It is
# exercised by every suite that performs misaligned loads and stores to main
# memory and expects them to complete: the Misalign* suites (scalar integer,
# compressed, F/D floating point, and vector loads/stores at misaligned
# addresses), and the misaligned-load/store coverpoints of the exception suites,
# which check that no address-misaligned exception is raised. In UDB, Zicclsm
# requires MISALIGNED_LDST=true, which is the parameter those suites key on.
# The rule excludes AMOs, LR/SC and other Za* accesses, so ExceptionsZaamo,
# ExceptionsZalrsc and Zama16b are deliberately not listed.

normative_rule_definitions:
  # If the Zicclsm extension is implemented, then misaligned loads and stores to main memory
  # regions with both the coherence and cacheability PMAs must be supported.
  - name: Zicclsm_misaligned_support
    # Representative coverpoints; also cp_misalign of the other Misalign, MisalignZca, MisalignF and
    # MisalignD covergroups, cp_misalignv_ls_element_misaligned and cp_misalignv_ls_wholereg_misaligned
    # of the other MisalignV covergroups, and cp_load/store_address_misaligned of the Exceptions*
    # suites, which with MISALIGNED_LDST=true must complete without an address-misaligned exception
    coverpoint:
      [
        "{Misalign_lw_cg, Misalign_sw_cg}/cp_misalign",
        "MisalignZca_c_lw_cg/cp_misalign",
        "MisalignV_vle32_v_cg/cp_misalignv_ls_element_misaligned",
      ]
