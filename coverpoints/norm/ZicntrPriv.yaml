normative_rule_definitions:
  # controls the availability of the hardware performance-monitoring counters to the
  # next-lower privileged mode.
  - name: mcounteren_op
    # M-mode reads succeed for every mcounteren value
    coverpoint:
      [
        "ZicntrPriv_S_cg/cp_mcounteren_access_s",
        "ZicntrPriv_U_cg/cp_mcounteren_access_u",
        "ZicntrPriv_Sm_cg/cp_mcounteren_access_m",
        "ZicntrH_cg/cp_mcounteren_access_vs",
      ]

  # The counter-enable (scounteren) CSR is a 32-bit register that controls the
  # availability of the hardware performance monitoring counters to U-mode.
  - name: scounteren
    coverpoint: ["S_scsr_cg/cp_scsr_access"]

  # scounteren must be implemented. However, any of the bits may be read-only zero,
  # indicating reads to the corresponding counter will cause an exception when
  # executing in U-mode. Hence, they are effectively WARL fields.
  - name: scounteren_acc
    coverpoint: ["ZicntrPriv_S_cg/cp_scounteren_access_u"]

  # When the CY, TM, IR, or HPMn bit in the scounteren register is clear, attempts
  # to read the cycle, time, instret, or hpmcountern register while executing in
  # U-mode will cause an illegal-instruction exception. When one of these bits is
  # set, access to the corresponding register is permitted.
  - name: scounteren_op
    # Sm: M-mode reads succeed for every scounteren value
    coverpoint:
      [
        "ZicntrPriv_S_cg/{cp_scounteren_access_u, cp_mscounteren_access_u}",
        "ZicntrPriv_Sm_cg/cp_scounteren_access_m",
      ]

  # The counters are accessible from M-mode regardless of the counter-enable registers.
  - name: Zihpm_op_sz_mode_acc_priv
    coverpoint:
      ["ZicntrPriv_Sm_cg/{cp_mcounteren_access_m, cp_scounteren_access_m}"]

  # The settings in this register only control accessibility. The act of reading or
  # writing this register does not affect the underlying counters, which continue to
  # increment even when not accessible.
  - name: mcounteren_inc_inaccessible
    coverpoint:
      [
        "ZicntrPriv_S_cg/cp_mcounter_inc_inaccessible",
        "ZicntrPriv_U_cg/cp_mcounter_inc_inaccessible",
      ]

  # When the CY, TM, IR, or HPMn bit in the mcounteren register is clear, attempts
  # to read the cycle, time, instret, or hpmcountern register while executing in
  # S-mode or U-mode will cause an illegal-instruction exception.
  - name: mcounteren_clr_ill_inst_exc
    coverpoint:
      [
        "ZicntrPriv_S_cg/cp_mcounteren_access_s",
        "ZicntrPriv_U_cg/cp_mcounteren_access_u",
      ]

  # When one of these bits is set, access to the corresponding register is permitted
  # in the next implemented privilege mode (S-mode if implemented, otherwise
  # U-mode).
  - name: mcounteren_set_nxt_priv
    coverpoint:
      [
        "ZicntrPriv_S_cg/cp_mcounteren_access_s",
        "ZicntrPriv_U_cg/cp_mcounteren_access_u",
      ]

  # As ECALL and EBREAK cause synchronous exceptions, they are not considered to
  # retire, and should not increment the minstret CSR.
  - name: ecall_ebreak_no_minstret_inc
    # In the S group the instret difference spans T-SBI ecalls; ebreak is not exercised
    # (directed ecall/ebreak instret tests are in the Sm and U groups)
    coverpoint:
      [
        "ZicntrPriv_S_cg/cp_mcounter_inc_inaccessible",
        "ZicntrPriv_Sm_cg/{cp_instret_ecall, cp_instret_ebreak}",
        "ZicntrPriv_U_cg/{cp_instret_ecall, cp_instret_ebreak}",
      ]
