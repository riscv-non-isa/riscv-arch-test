# CI configuration for Whisper simulator

# SsstrictSm_CSR: Sail 0.16 lacks Smaia and Smrnmi, whose CSRs Whisper implements
# Smstateen: the -mu configs pass. On the max configs Whisper implements Sscsrind and Ssaia, so
#   mstateen0.CSRIND, AIA and IMSIC are writable, but Sail does not model those extensions
#   (https://github.com/riscv/sail-riscv/issues/1134, https://github.com/riscv/sail-riscv/pull/1874).
# SsstrictS_CSR: Sail traps on siselect/stopi accesses that Whisper permits with mstateen0 enabled.
# Ssnpm_sv*_pmm00_sweep, Ssnpm_sv*_pmm10_sweep, SmnpmS_sv*_pmm00_sweep, SmnpmS_sv*_pmm10_sweep (rv64-max; the other
#   pointer-masking groups and suites pass): ssamoswap.w to a non-canonical masked address gets a store/AMO access
#   fault on Whisper where Sail reports a store/AMO page fault (https://github.com/tenstorrent/whisper/issues/200).
#   On sv48 and sv57 the S-mode failure report then page-faults on the console, which the test's image map leaves
#   unmapped, and recurses until the trap signature overflows, so those sweeps report a signature offset mismatch.
# SdtrigSm_tdata2_translate: on RV32, Whisper replaces tdata2 = 0xFFFFFFFF with the NAPOT mask on an
#   mcontrol6 trigger that does not use NAPOT (https://github.com/tenstorrent/whisper/issues/218, fix
#   https://github.com/tenstorrent/whisper/pull/219). Drop it when the Whisper pin includes the fix.
# Sstc_hs, SstcSm_vstimecmp, SstcSm_vstip: on whisper-rv64-max, which has no time CSR, hip.VSTIP never follows
#   vstimecmp: with menvcfg.STCE = henvcfg.STCE = 1 and vstimecmp = 0, hip.VSTIP reads 0 (mip.VSTIP is right).
#   CsRegs::virtTimerExpired() requires the time CSR (https://github.com/tenstorrent/whisper/issues/220, fix
#   https://github.com/tenstorrent/whisper/pull/221). Drop it when the Whisper pin includes the fix.
ci_enabled: true
exclude_extensions: "SdtrigSm_tdata2_translate,SsstrictSm_CSR,SsstrictS_CSR,Smstateen,Sstc_hs,SstcSm_vstimecmp,SstcSm_vstip,Ssnpm_sv39_pmm00_sweep,Ssnpm_sv39_pmm10_sweep,Ssnpm_sv48_pmm00_sweep,Ssnpm_sv48_pmm10_sweep,Ssnpm_sv57_pmm00_sweep,Ssnpm_sv57_pmm10_sweep,SmnpmS_sv39_pmm00_sweep,SmnpmS_sv39_pmm10_sweep,SmnpmS_sv48_pmm00_sweep,SmnpmS_sv48_pmm10_sweep,SmnpmS_sv57_pmm00_sweep,SmnpmS_sv57_pmm10_sweep"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 2
