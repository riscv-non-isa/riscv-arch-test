# CI configuration for Whisper simulator

# SsstrictSm: Sail 0.16 lacks Smaia and Smrnmi, whose CSRs Whisper implements
# SstcH, SstcHSm: whisper-rv64-max-notime, whose time CSR does not exist, does not raise VSTIP when time +
#   htimedelta >= vstimecmp (SstcHSm_vstip with vstimecmp = 0 never sees hip.VSTIP); whisper-rv64-max passes (no issue filed)
# Smstateen: the -mu configs pass. On the max configs Whisper implements Sscsrind and Ssaia, so
#   mstateen0.CSRIND, AIA and IMSIC are writable, but Sail does not model those extensions
#   (https://github.com/riscv/sail-riscv/issues/1134, https://github.com/riscv/sail-riscv/pull/1874).
# SsstrictS: Sail traps on siselect/stopi accesses that Whisper permits with mstateen0 enabled.
# Ssnpm,SsnpmSm,Smmpm,SmnpmS: Failing due to mismatch in scause/mcause ,Issue Link (https://github.com/tenstorrent/whisper/issues/200)
# SdtrigSm: on RV32, Whisper replaces tdata2 = 0xFFFFFFFF with the NAPOT mask on an mcontrol6 trigger that
#   does not use NAPOT, so SdtrigSm_tdata2_translate fails (https://github.com/tenstorrent/whisper/issues/218,
#   fix https://github.com/tenstorrent/whisper/pull/219). Narrow this to SdtrigSm_tdata2_translate once
#   group exclusions (#2792) land, and drop it when the Whisper pin includes the fix.
ci_enabled: true
exclude_extensions: "SdtrigSm,SsstrictSm,SsstrictS,Smstateen,SstcH,SstcHSm,Ssnpm,SsnpmSm,Smmpm,SmnpmS,SmnpmSSm,SmnpmU,SmnpmUSm"
exclude_configs:
  - whisper-rv32-max-spike-ref
  - whisper-rv64-max-spike-ref
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 2
