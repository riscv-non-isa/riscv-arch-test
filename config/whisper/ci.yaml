# CI configuration for Whisper simulator

# Ssstrict_Sm_CSR: Sail 0.16 lacks Smaia and Smrnmi, whose CSRs Whisper implements
# SstcH, SstcHSm: whisper-rv64-max-notime, whose time CSR does not exist, does not raise VSTIP when time +
#   htimedelta >= vstimecmp (SstcHSm_vstip with vstimecmp = 0 never sees hip.VSTIP); whisper-rv64-max passes (no issue filed)
# Smstateen: the -mu configs pass. On the max configs Whisper implements Sscsrind and Ssaia, so
#   mstateen0.CSRIND, AIA and IMSIC are writable, but Sail does not model those extensions
#   (https://github.com/riscv/sail-riscv/issues/1134, https://github.com/riscv/sail-riscv/pull/1874).
# Ssstrict_S_CSR: Sail traps on siselect/stopi accesses that Whisper permits with mstateen0 enabled.
# SdtrigSm_csr_access_common, SdtrigSm_csr_access_global, SdtrigSm_tcontrol, SdtrigS_csr_access_common,
#   SdtrigS_csr_access_global (max configs): Whisper implements tcontrol while using mstatus.MIE/SIE for breakpoint
#   reentrancy, which Sail cannot model (it has tcontrol only with Use_tcontrol,
#   https://github.com/riscv/sail-riscv/issues/2039), so the reference traps on the tcontrol accesses.
ci_enabled: true
exclude_extensions: "SdtrigSm_csr_access_common,SdtrigSm_csr_access_global,SdtrigSm_tcontrol,SdtrigS_csr_access_common,SdtrigS_csr_access_global,Ssstrict_Sm_CSR,Ssstrict_S_CSR,Smstateen,SstcH,SstcHSm"
install_script: ".github/scripts/install-whisper.sh"
apt_packages: "libboost-program-options-dev"
shards: 2
