# CI configuration for Spike simulator
# Shared across all Spike configs

ci_enabled: true
# Run experimental extensions in their dedicated workflow job.
exclude_configs:
  - spike-rv64-experimental
  # Spike is also the reference model; these configs exist to run the Zcmp-dependent Sdtrig tests locally
  - spike-rv32-zcmp-spike-ref
  - spike-rv64-zcmp-spike-ref
# Sscofpmf_Sm_access (rv32-max), Sscofpmf_{Sm,S,U}_inhibit, Sscofpmf_{Sm,S}_mcounteren, Sscofpmf_{Sm,S,U}_overflow,
#   Sscofpmf_{Sm,S}_shadow (the other groups pass): spike hardwires mhpmcounter3..31 to 0 but keeps mhpmevent3..31 writable
#   (https://github.com/riscv-software-src/riscv-isa-sim/issues/2370). Sail's
#   writable_hpm_counters makes both or neither writable, so no reference config matches.
exclude_extensions: "Sscofpmf_Sm_access,Sscofpmf_Sm_inhibit,Sscofpmf_Sm_mcounteren,Sscofpmf_Sm_overflow,Sscofpmf_Sm_shadow,Sscofpmf_S_inhibit,Sscofpmf_S_mcounteren,Sscofpmf_S_overflow,Sscofpmf_S_shadow,Sscofpmf_U_inhibit,Sscofpmf_U_overflow"
install_script: ".github/scripts/install-spike.sh"
apt_packages: "device-tree-compiler libboost-regex-dev libboost-system-dev"
shards: 1
config_shards:
  spike-rv32-mu: 2
  spike-rv32-max: 2
  spike-rv64-m: 2
  spike-rv64-mu: 2
  spike-rv64-max: 2
