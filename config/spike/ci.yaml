# CI configuration for Spike simulator
# Shared across all Spike configs

ci_enabled: true
# Smstateen will be added back once sail starts supporting Sscsrind too
# Sdtrig* not yet supported in Sail reference
# Sail 0.14 changed illegal-write handling for the WLRL `scause`/`mcause` CSRs: it now
#   retains the previous legal value, where 0.13.1 stored the written value verbatim. Both
#   are permitted for WLRL, but ACT exact-matches the reference, so `S`/`Sm` mismatch on
#   every DUT that stores the raw value. Excluded until the cause-code testcases are relaxed.
# S/Sm additionally mismatch on `menvcfg`/`senvcfg` FIOM: Sail 0.14 requires FIOM to be
#   writable whenever a satp mode other than Bare is supported, but Spike omits FIOM from
#   both envcfg masks (https://github.com/riscv-software-src/riscv-isa-sim/issues/2421), so it reads back as zero.
exclude_extensions: "Smstateen,SdtrigSm,SdtrigS,SdtrigU,S,Sm"
install_script: ".github/scripts/install-spike.sh"
apt_packages: "device-tree-compiler libboost-regex-dev libboost-system-dev"
shards: 1
config_shards:
  spike-rv64-max: 2
