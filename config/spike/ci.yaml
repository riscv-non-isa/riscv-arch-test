# CI configuration for Spike simulator
# Shared across all Spike configs

ci_enabled: true
# Run experimental extensions in their dedicated workflow job.
exclude_configs:
  - spike-rv64-experimental
# SscofpmfSm_access (rv32-max), Sscofpmf{Sm,S,U}_inhibit, Sscofpmf{Sm,S}_mcounteren, Sscofpmf{Sm,S,U}_overflow,
#   Sscofpmf{Sm,S}_shadow (the other groups pass): spike hardwires mhpmcounter3..31 to 0 but keeps mhpmevent3..31 writable
#   (https://github.com/riscv-software-src/riscv-isa-sim/issues/2370). Sail's
#   writable_hpm_counters makes both or neither writable, so no reference config matches.
exclude_extensions: "SscofpmfSm_access,SscofpmfSm_inhibit,SscofpmfSm_mcounteren,SscofpmfSm_overflow,SscofpmfSm_shadow,SscofpmfS_inhibit,SscofpmfS_mcounteren,SscofpmfS_overflow,SscofpmfS_shadow,SscofpmfU_inhibit,SscofpmfU_overflow"
install_script: ".github/scripts/install-spike.sh"
apt_packages: "device-tree-compiler libboost-regex-dev libboost-system-dev"
shards: 1
config_shards:
  spike-rv32-mu: 2
  spike-rv32-max: 2
  spike-rv64-m: 2
  spike-rv64-mu: 2
  spike-rv64-max: 2
