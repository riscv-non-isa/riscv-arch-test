# CI configuration for Spike simulator
# Shared across all Spike configs

ci_enabled: true
# Run experimental extensions in their dedicated workflow job.
exclude_configs:
  - spike-rv64-experimental
# Smstateen: spike-rv{32,64}-max implement scontext, so mstateen0.CONTEXT is writable, but Sail cannot
#   model scontext (https://github.com/riscv/sail-riscv/issues/2013). The -mu configs pass.
# Sdtrig*_Mcontrol6: Sail 0.15 lacks mcontrol6 triggers, so it expects an illegal-instruction trap where the hart takes the breakpoint (https://github.com/riscv/sail-riscv/issues/222)
# Sscofpmf*: spike hardwires mhpmcounter3..31 to 0 but keeps mhpmevent3..31 writable
#   (https://github.com/riscv-software-src/riscv-isa-sim/issues/2370). Sail's
#   writable_hpm_counters makes both or neither writable, so no reference config matches.
exclude_extensions: "Smstateen,SdtrigSm_Mcontrol6,SdtrigS_Mcontrol6,SdtrigU_Mcontrol6,SscofpmfSm,SscofpmfS,SscofpmfU"
install_script: ".github/scripts/install-spike.sh"
apt_packages: "device-tree-compiler libboost-regex-dev libboost-system-dev"
shards: 1
config_shards:
  spike-rv32-mu: 2
  spike-rv32-max: 2
  spike-rv64-m: 2
  spike-rv64-mu: 2
  spike-rv64-max: 2
