# CI configuration for the cva6 family (only cv64a6_imafdcv_sv39 is runnable)

ci_enabled: true

# Ara 34bd3bc1 with CVA6 99eac9a6. Findings are collected in https://github.com/openhwfoundation/cva6/issues/3585.
# Vx8, Vx16, Vx32, Vx64, Vls8, Vls16, Vls32, Vls64: vfirst.m and vcpop.m ignore vl, so the self-check fails: https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/masku/masku.sv#L858-L861 (https://github.com/pulp-platform/ara/issues/446)
# Vf32, Vf64: the same vfirst.m bug, and frflags reads fflags before Ara returns the flags of a preceding vector FP instruction, because Ara acknowledges it at dispatch and CVA6 ORs the flags in whenever they arrive: https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/ara_dispatcher.sv#L622-L624 https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/csr_regfile.sv#L1960-L1963
# S-, S_scsr-, S_scsr_addr: sstatus.VS reads 0: https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/include/ariane_pkg.sv#L114-L127
# U-, Sm_inst, ExceptionsS, ExceptionsU: ebreak writes the instruction to xtval: https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/decoder.sv#L1605
# U_V_uvcsr, U_V_uvcsrwalk-, U_V_vcsr, U_V_vset: the acc_dispatcher store-overflow assertion stops the simulation: https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/acc_dispatcher.sv#L433-L435
# Sm_V_vcsr, Sm_V_vset, S_V_vcsr, S_V_vset: vsetvl ignores rs2 above bit 7, so rs2.vill is lost, and the vcsr groups hit the U_V assertion: https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/ara_dispatcher.sv#L639
# Sm_F, Sm_mstatus, S_F, U_F: mstatus.SD ignores mstatus.VS: https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/csr_regfile.sv#L1940
# Sm_VF, S_VF, U_VF: vfdiv.vv of 1.0/0.0 sets NV as well as DZ: https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/lane/vmfpu.sv#L1332
# Sm_mcsr_access, Sm_mcsr_walk, Sm_scsr, Sm_shadow, Sm_xret: mstatus WPRI bits 36-62 are writable: https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/csr_regfile.sv#L1498-L1529
# Sstvecd: stvec reads bits 5:1 as 0: https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/csr_regfile.sv#L480
# Sstvala, ExceptionsF, ExceptionsSm, ExceptionsZc, ExceptionsZalrsc, ExceptionsSvZaamo, ExceptionsSvZaamoSm, ExceptionsSvZalrsc, ExceptionsSvZalrscSm: misaligned accesses do not trap, because the MMU drops the misaligned exception: https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/cva6_mmu/cva6_mmu.sv#L513-L514
# ExceptionsSv, ExceptionsSvSm_sv39_exceptions: a misaligned lw under Sv39 trips a load_unit assertion: https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/load_unit.sv#L554-L556
# Sv_sv39_nleaf_pte_DAU, Sv_sv39_satp: a non-leaf PTE with A, D or U set does not fault, and an ASID change trips the TLB multi-hit assertion: https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/cva6_mmu/cva6_ptw.sv#L497-L508
# InterruptsS, InterruptsSm_enable, InterruptsSm_priority, InterruptsSm_trigger: an interrupt writes the interrupted instruction to xtval instead of zero (fixed upstream by https://github.com/openhwfoundation/cva6/pull/3386 for https://github.com/openhwfoundation/cva6/issues/3379): https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/csr_regfile.sv#L2050-L2057
# InterruptsSm_priority_mideleg, InterruptsSm_priority_mie_M: the interrupt is chosen before mideleg is applied, so a pending delegated SEI hides an undelegated STI: https://github.com/pulp-platform/cva6/blob/99eac9a649001bdf5b8f9da52e0ca73d5c48db1c/core/decoder.sv#L1672-L1700
# D, F (their fdiv, fsqrt, fused multiply-add and fcvt groups), ZicsrF: wrong fflags or results from fdiv, fsqrt, fused multiply-add and fcvt: https://github.com/openhwfoundation/cva6/issues/3585
# Zaamo, Zalrsc-sc.w, Zalrsc-sc.d, ExceptionsZaamo: testbench; the L2 has no atomic support, so AMOs return 0 and SC fails: https://github.com/pulp-platform/ara/blob/34bd3bc152421b4601a7bf3d6e8e91ffb545c99e/hardware/src/ara_soc.sv#L191-L204
exclude_extensions: "Vx8,Vx16,Vx32,Vx64,Vls8,Vls16,Vls32,Vls64,Vf32,Vf64,S-,S_F,S_VF,S_V_vcsr,S_V_vset,S_scsr-,S_scsr_addr,U-,U_F,U_VF,U_V_uvcsr,U_V_uvcsrwalk-,U_V_vcsr,U_V_vset,ExceptionsS,ExceptionsU,Sm_F,Sm_VF,Sm_V_vcsr,Sm_V_vset,Sm_inst,Sm_mcsr_access,Sm_mcsr_walk,Sm_mstatus,Sm_scsr,Sm_shadow,Sm_xret,Sstvecd,Sstvala,ExceptionsF,ExceptionsSm,ExceptionsZc,ExceptionsSvZaamo,ExceptionsSvZaamoSm,ExceptionsSvZalrsc,ExceptionsSvZalrscSm,ExceptionsSv,ExceptionsSvSm_sv39_exceptions,Sv_sv39_nleaf_pte_DAU,Sv_sv39_satp,InterruptsS,InterruptsSm_enable,InterruptsSm_priority,InterruptsSm_trigger,D-fcvt.d.s,D-fcvt.s.d,D-fdiv.d,D-fdiv.s,D-fmadd.d,D-fmsub.d,D-fnmadd.d,D-fnmsub.d,D-fsqrt.d,D-fsqrt.s,F-fdiv.s,F-fmadd.s,F-fmsub.s,F-fnmadd.s,F-fnmsub.s,F-fsqrt.s,ZicsrF,Zaamo,Zalrsc-sc.d,Zalrsc-sc.w,ExceptionsZaamo,ExceptionsZalrsc"

apt_packages: "autoconf flex bison help2man libfl-dev ccache libelf-dev"
install_script: ".github/scripts/install-ara.sh"
setup_script: ".github/scripts/setup-ara.sh"
