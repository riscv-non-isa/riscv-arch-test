# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: spacemit-k3-pico-itx
description: >
  SpacemiT K3 Pico-ITX (X100 cores), first ACT configuration. Started from the BPI-F3 (K1/X60)
  configuration and changed where the K3 was measured with the runner's CSR probe on the board
  (runner repo artifacts/onboarding/spacemit_k3_20261019/csr_probe_v6/): IDs, PMP entries,
  medeleg/mideleg masks, VLEN 256, Sv39 only, ASID 16, PMP granularity 4 KiB, PA 40 bits,
  misaligned scalar loads in hardware. The extension list is still the K1's RVA22S64 subset:
  the K3 implements the RVA23 set (device tree riscv,isa-extensions), and H is present but
  misa.H = 0 at reset (writable). Hypervisor branch: H 1.0 enabled with csr_probe values; the RVA23 additions are left for a later revision.
  Parameters not listed above are the K1's values and UNVERIFIED on the K3.

implemented_extensions:
  - { name: I,  version: "= 2.1" }
  - { name: M,  version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: A,  version: "= 2.1.0" }
  - { name: F,  version: "= 2.2.0" }
  - { name: D,  version: "= 2.2.0" }
  - { name: Zfh, version: "= 1.0.0" }
  - { name: Zfhmin, version: "= 1.0.0" }
  - { name: C,  version: "= 2.0" }
  - { name: B,  version: "= 1.0.0" }
  - { name: V,  version: "= 1.0.0" }

  # --- Privilege modes (behavioral inference: Linux boots on K1) --- (K1 basis; K3 boots Linux too)
  - { name: U,  version: "= 1.0.0" }
  - { name: S,  version: "= 1.13.0" }
  - { name: Sm, version: "= 1.13.0" }
  # H: device tree riscv,isa-extensions and RVA23; misa.H = 0 at runner entry but writable
  # (csr_probe), so RVMODEL_BOOT sets it. H CSR values: csr_probe 2026-10-22.
  - { name: H,  version: "= 1.0.0" }

  # --- Atomics (spec-implied from A) ---
  - { name: Zaamo,  version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }

  # --- Bit manipulation (DTS confirmed) ---
  - { name: Zba, version: "= 1.0.0" }
  - { name: Zbb, version: "= 1.0.0" }
  - { name: Zbc, version: "= 1.0.0" }
  - { name: Zbkc, version: "= 1.0.0" } # required by Zbc 1.0 in current UDB
  - { name: Zbs, version: "= 1.0.0" }
  - { name: Zkt, version: "= 1.0.0" }

  # --- Compressed (spec-implied from C) ---
  - { name: Zca, version: "= 1.0.0" }
  - { name: Zcd, version: "= 1.0.0" }

  # --- Cache (DTS confirmed) ---
  - { name: Zicbom, version: "= 1.0.0" }
  - { name: Zicboz, version: "= 1.0.0" }

  # --- CSR / counter extensions (Zicsr/Zifencei/Zihintpause DTS confirmed;
  #     Zicntr/Zihpm confirmed via OpenSBI hardware CSR probe, not DTS) ---
  - { name: Zicntr,     version: "= 2.0" }
  - { name: Zicsr,      version: "= 2.0" }
  - { name: Zifencei,   version: "= 2.0.0" }
  - { name: Zihintpause,version: "= 2.0.0" }
  - { name: Zihpm,      version: "= 2.0.0" }

  # --- Conditional / conditional ops (DTS confirmed) ---
  - { name: Zicond, version: "= 1.0" }

  # --- Supervisor extensions (DTS confirmed) ---
  - { name: Sscofpmf, version: "= 1.0.0" }
  - { name: Sstc,     version: "= 1.0.0" }

  # --- Virtual memory (DTS confirmed / behavioral inference) ---
  - { name: Sv39,    version: "= 1.0.0" }   # behavioral inference (Linux boot)
  - { name: Svbare,  version: "= 1.0.0" }   # behavioral inference (Linux boot)
  - { name: Svpbmt,  version: "= 1.0.0" }   # DTS confirmed
  - { name: Svinval, version: "= 1.0.0" }
  - { name: Svnapot, version: "= 1.0.0" }

  # --- Vector subsets (spec-implied from V + F + D, VLEN=256) ---
  - { name: Zve32x,  version: "= 1.0.0" }
  - { name: Zve32f,  version: "= 1.0.0" }
  - { name: Zve64x,  version: "= 1.0.0" }
  - { name: Zve64f,  version: "= 1.0.0" }
  - { name: Zve64d,  version: "= 1.0.0" }
  - { name: Zvfh,    version: "= 1.0.0" }
  - { name: Zvfhmin, version: "= 1.0.0" }
  - { name: Zvkt,    version: "= 1.0.0" }
  - { name: Zvl32b,  version: "= 1.0.0" }
  - { name: Zvl64b,  version: "= 1.0.0" }
  - { name: Zvl128b, version: "= 1.0.0" }
  - { name: Zvl256b, version: "= 1.0.0" }   # VLEN=256 satisfies this

params:
  # misa.X is set on the K3 (csr_probe): vendor-specific extensions.
  NON_STANDARD_EXTENSION_IMPLEMENTED: true
  # A params
  MISALIGNED_AMO: false
  LRSC_RESERVATION_STRATEGY: "reserve exactly enough to cover the access"
  LRSC_FAIL_ON_VA_SYNONYM: false
  LRSC_MISALIGNED_BEHAVIOR: "always raise access fault"
  LRSC_FAIL_ON_NON_EXACT_LRSC: false
  MUTABLE_MISA_A: false
  # M params
  MUTABLE_MISA_M: false
  # F params
  MUTABLE_MISA_F: false
  HW_MSTATUS_FS_DIRTY_UPDATE: precise
  MSTATUS_FS_LEGAL_VALUES: [0, 1, 2, 3]
  # D params
  MUTABLE_MISA_D: false
  # C params
  MUTABLE_MISA_C: false
  # B params
  MUTABLE_MISA_B: false
  # V params
  MUTABLE_MISA_V: false
  HW_MSTATUS_VS_DIRTY_UPDATE: precise
  # CBO params
  CACHE_BLOCK_SIZE: 64
  FORCE_UPGRADE_CBO_INVAL_TO_FLUSH: false
  # Zicntr params
  TIME_CSR_IMPLEMENTED: true
  # U params
  MUTABLE_MISA_U: false
  U_MODE_ENDIANNESS: little
  UXLEN: [64]
  TRAP_ON_ECALL_FROM_U: true
  WFI_U_MODE: false
  # S params
  MUTABLE_MISA_S: false
  ASID_WIDTH: 16
  S_MODE_ENDIANNESS: little
  SXLEN: [64]
  REPORT_VA_IN_MTVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_PAGE_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_PAGE_FAULT: true
