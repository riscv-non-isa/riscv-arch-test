      false, # 1: time (handled separately, not an HPM counter)
      false, # 2: instret (handled separately, not an HPM counter)
      true,  # 3
      true,  # 4
      true,  # 5
      true,  # 6
      true,  # 7
      true,  # 8
      true,  # 9
      true,  # 10
      true,  # 11
      true,  # 12
      true,  # 13
      true,  # 14
      true,  # 15
      true,  # 16
      true,  # 17
      true,  # 18
      false, # 19: not implemented on real K1 silicon (K1 value, UNVERIFIED on the K3)
      false, # 20
      false, # 21
      false, # 22
      false, # 23
      false, # 24
      false, # 25
      false, # 26
      false, # 27
      false, # 28
      false, # 29
      false, # 30
      false, # 31
    ]
  # The implemented K1/X60 HPM counters expose 64 bits of precision on RV64. K3: mhpmcounter3 is 64-bit (csr_probe).
  HPM_COUNTER3_WIDTH: 64
  HPM_COUNTER4_WIDTH: 64
  HPM_COUNTER5_WIDTH: 64
  HPM_COUNTER6_WIDTH: 64
  HPM_COUNTER7_WIDTH: 64
  HPM_COUNTER8_WIDTH: 64
  HPM_COUNTER9_WIDTH: 64
  HPM_COUNTER10_WIDTH: 64
  HPM_COUNTER11_WIDTH: 64
  HPM_COUNTER12_WIDTH: 64
  HPM_COUNTER13_WIDTH: 64
  HPM_COUNTER14_WIDTH: 64
  HPM_COUNTER15_WIDTH: 64
  HPM_COUNTER16_WIDTH: 64
  HPM_COUNTER17_WIDTH: 64
  HPM_COUNTER18_WIDTH: 64
  HPM_EVENTS: [0]
  MCOUNTINHIBIT_IMPLEMENTED: true
  COUNTINHIBIT_EN:
    [
      true,  # 0: cycle
      false, # 1: time
      true,  # 2: instret
      true, true, true, true, true, true, true, true, true,
      true, true, true, true, true, true, true, # 3..18
      false, false, false, false, false, false, false,
      false, false, false, false, false, false, # 19..31: no HPM counter
    ]
  MCOUNTENABLE_EN:
    [
      true,  # 0: cycle
      true,  # 1: time
      true,  # 2: instret
      true,  # 3
      true,  # 4
      true,  # 5
      true,  # 6
      true,  # 7
      true,  # 8
      true,  # 9
      true,  # 10
      true,  # 11
      true,  # 12
      true,  # 13
      true,  # 14
      true,  # 15
      true,  # 16
      true,  # 17
      true,  # 18
      false, # 19: hpmcounter19 not implemented on real K1 silicon (K1 value, UNVERIFIED on the K3)
      false, # 20
      false, # 21
      false, # 22
      false, # 23
      false, # 24
      false, # 25
      false, # 26
      false, # 27
      false, # 28
      false, # 29
      false, # 30
      false, # 31
