# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: milkv-megrez-p550
description: >-
  Milk-V Megrez, ESWIN EIC7700X, SiFive P550 (hart 1 runs ACT payloads).
  ISA rv64imafdch_zicntr_zicsr_zifencei_zihpm_zba_zbb_sscofpmf (Linux),
  Sv48 (DTB mmu-type, TRM 3.4). Sources: EIC7700X SoC TRM v1.0.0-20250103
  Part 1 ("TRM"), OpenSBI v1.5 and Linux boot logs on the board.
  Values marked UNVERIFIED are placeholders that
  must be confirmed by a hardware CSR probe; see README.md.
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: A, version: "= 2.1.0" }
  - { name: F, version: "= 2.2.0" }
  - { name: D, version: "= 2.2.0" }
  - { name: C, version: "= 2.0" }
  - { name: U, version: "= 1.0.0" }
  - { name: S, version: "= 1.12.0" }  # DEVIATION: hardware is 1.11 (TRM, OpenSBI); UDB H 1.0 requires S>=1.12. Test selection only; sail.json stays Privileged_ISA_1_11.
  - { name: Sm, version: "= 1.12.0" }  # DEVIATION: hardware is 1.11 (TRM, OpenSBI); UDB H 1.0 requires S>=1.12. Test selection only; sail.json stays Privileged_ISA_1_11.
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zifencei, version: "= 2.0.0" }
  - { name: Zihpm, version: "= 2.0.0" }
  - { name: Zicntr, version: "= 2.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: Zca, version: "= 1.0.0" }
  - { name: Zcd, version: "= 1.0.0" }
  - { name: Zba, version: "= 1.0.0" }
  - { name: Zbb, version: "= 1.0.0" }
  # H: TRM Table 3-5 labels it 0.6 (draft), but the TRM CSR set (mtinst,
  # mtval2, htinst, hvip, hgeie, hcounteren) matches ratified 1.0, which is
  # what UDB/ACT model. Enabled on the hypervisor branch to generate H
  # tests; failures must be triaged for 0.6-vs-1.0 differences.
  - { name: H, version: "= 1.0.0" }
  - { name: Sscofpmf, version: "= 1.0.0" }
  - { name: Sscounterenw, version: "= 1.0.0" }
  # Sscounterenw / Sstvecd: UNVERIFIED for P550 (kept from the RVA-style base).
  - { name: Sstvecd, version: "= 1.0.0" }
  - { name: Ssu64xl, version: "= 1.0.0" }
  - { name: Sv39, version: "= 1.0.0" }
  - { name: Sv48, version: "= 1.0.0" }
  - { name: Svbare, version: "= 1.0.0" }

params:
  # OpenSBI reports misa as rv64imafdchx on Megrez: misa.X is set.
  NON_STANDARD_EXTENSION_IMPLEMENTED: true
  # A params (UNVERIFIED for P550; VF2/U74 values)
  MISALIGNED_AMO: false
  LRSC_RESERVATION_STRATEGY: "reserve naturally-aligned 64-byte region"
  LRSC_FAIL_ON_VA_SYNONYM: false
  LRSC_MISALIGNED_BEHAVIOR: "always raise access fault"
  LRSC_FAIL_ON_NON_EXACT_LRSC: false
  # CONFIG_PTR_ADDRESS: 0
  MUTABLE_MISA_A: false
  MCOUNTINHIBIT_IMPLEMENTED: true
  # M params
  MUTABLE_MISA_M: false
  # F params
  MUTABLE_MISA_F: false
  HW_MSTATUS_FS_DIRTY_UPDATE: imprecise
  MSTATUS_FS_LEGAL_VALUES: [0, 1, 2, 3]
  # D params
  MUTABLE_MISA_D: false
  # C params
  MUTABLE_MISA_C: false
  # B params
  # MUTABLE_MISA_B: true
  # V params
  #MUTABLE_MISA_V: false
  #HW_MSTATUS_VS_DIRTY_UPDATE: precise
  # CBO params
  # CACHE_BLOCK_SIZE: 64
  # FORCE_UPGRADE_CBO_INVAL_TO_FLUSH: false
  # Zicntr params
  # UNVERIFIED: whether P550 implements the time CSR or traps to M-mode.
  TIME_CSR_IMPLEMENTED: false
  # U params
  MUTABLE_MISA_U: false
  U_MODE_ENDIANNESS: little
  UXLEN: [64]
  TRAP_ON_ECALL_FROM_U: true
  WFI_U_MODE: false
  # S params
  MUTABLE_MISA_S: false
  # Linux on Megrez: "ASID allocator disabled (0 bits)".
  ASID_WIDTH: 0
  S_MODE_ENDIANNESS: little
  SXLEN: [64]
  REPORT_VA_IN_MTVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_PAGE_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_STVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_PAGE_FAULT: true
  REPORT_ENCODING_IN_STVAL_ON_ILLEGAL_INSTRUCTION: true
  STVAL_WIDTH: 64
  # HPM counters 3-6 implemented (OpenSBI MHPM mask 0x78).
  SCOUNTENABLE_EN: [false, false, false, true, true, true, true, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false]
  STVEC_MODES: [0, 1]
  # TRM Table 3-58: stvec.BASE must be 128-byte aligned when MODE=1.
  STVEC_BASE_ALIGNMENT_VECTORED: 128
  SATP_MODE_BARE: true
  TRAP_ON_ECALL_FROM_S: true
  SEI_INTR_IMPL: true
  SSI_INTR_IMPL: true
  STI_INTR_IMPL: true
  MSTATUS_VS_LEGAL_VALUES: [0]
  # Sm params
  MXLEN: 64
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  TRAP_ON_ECALL_FROM_M: true
  MEI_INTR_IMPL: true
  MSI_INTR_IMPL: true
  MTI_INTR_IMPL: true
  # UNVERIFIED for P550 (U74 value).
  WFI_FINITE: false
  TRAP_ON_EBREAK: true
  MARCHID_IMPLEMENTED: true
  # UNVERIFIED: marchid/mimpid/mvendorid not yet read on Megrez (U74 values kept).
  ARCH_ID_VALUE: 0x8000000000000007
  MIMPID_IMPLEMENTED: true
  IMP_ID_VALUE: 0x100
  VENDOR_ID_BANK: 0xC
  VENDOR_ID_OFFSET: 0x2
  # TRM 3.4 (mcause): misaligned loads/stores trap for emulation, or raise an
  # access fault where emulation is unsafe (I/O). Fault priority UNVERIFIED.
  MISALIGNED_LDST: false
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  # MISALIGNED_MAX_ATOMICITY_GRANULE_SIZE: 4096
  # MISALIGNED_SPLIT_STRATEGY: sequential_bytes
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: true
  TRAP_ON_ILLEGAL_WLRL: false
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  MTVAL_WIDTH: 64
 #  CONFIG_PTR_ADDRESS: 0
  PMA_GRANULARITY: 3
  # OpenSBI on Megrez: PMP Address Bits 39 = writable pmpaddr0 bits, which
  # hold PA[N-1:2], so N = 41 (derived from a hardware probe).
  PHYS_ADDR_WIDTH: 41
  M_MODE_ENDIANNESS: little
  MISA_CSR_IMPLEMENTED: true
  MTVEC_ACCESS: rw
  MTVEC_MODES: [0, 1]
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  # TRM Table 3-46: Direct mode 4-byte, Vectored mode 256-byte alignment.
  MTVEC_BASE_ALIGNMENT_VECTORED: 256
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: retain
  # TRM 3.4 PMP: 8 regions, 4096-byte granularity, pmpcfg0 implemented,
  # pmpcfg2 hardwired to zero. OpenSBI and the DTB agree. 16 = encoding
  # size (entries 8-15 read as zero), 8 usable.
  NUM_PMP_ENTRIES: 16
  NUM_USABLE_PMP_ENTRIES: 8
  PMP_GRANULARITY: 12
  PMP_NA4_SUPPORTED: false
  PMP_NAPOT_SUPPORTED: true
  PMP_TOR_SUPPORTED: true
  
  # ---- H params (hypervisor branch). TRM = EIC7700X TRM Part 1 tables 3-13,
  # 3-30, 3-31, 3-60, 3-61. UNVERIFIED values are placeholders to probe.
  # DEVIATION (Sm 1.12 declared for UDB): hardware is priv 1.11 and has no
  # mconfigptr; 0 = no configuration structure. Sail (1.11) traps on mconfigptr.
  CONFIG_PTR_ADDRESS: 0
  MUTABLE_MISA_H: false                 # UNVERIFIED (other misa bits fixed)
  VSXLEN: [64]                          # RV64-only core; hstatus.VSXL WARL (TRM 3-31)
  VUXLEN: [64]                          # RV64-only core
  VS_MODE_ENDIANNESS: little
  VU_MODE_ENDIANNESS: little
  GSTAGE_MODE_BARE: true                # hgatp Bare
  VSSTAGE_MODE_BARE: true               # vsatp Bare
  SV39X4_TRANSLATION: true              # TRM 3-13 hgatp MODE 8
  SV48X4_TRANSLATION: true              # TRM 3-13 hgatp MODE 9
  SV57X4_TRANSLATION: false
  SV39_VSMODE_TRANSLATION: true
  SV48_VSMODE_TRANSLATION: true
  SV57_VSMODE_TRANSLATION: false
  VMID_WIDTH: 14                        # UNVERIFIED: TRM field [57:44]; implemented width unknown
  NUM_EXTERNAL_GUEST_INTERRUPTS: 0      # UNVERIFIED: no AIA/IMSIC on P550 (TRM lists hgeie RW)
  # HPM counters 3-6 (mirrors MCOUNTENABLE_EN).
  HCOUNTENABLE_EN: [false, false, false, true, true, true, true, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false]
  VSSI_INTR_IMPL: true                  # TRM 3-60 hideleg bit 2
  VSTI_INTR_IMPL: true                  # TRM 3-60 hideleg bit 6
  VSEI_INTR_IMPL: true                  # TRM 3-60 hideleg bit 10
  VSTVEC_MODES: [0, 1]
  TRAP_ON_ECALL_FROM_VS: true
  IGNORE_INVALID_VSATP_MODE_WRITES_WHEN_V_EQ_ZERO: false   # UNVERIFIED
  # VS tval reporting mirrors the S-mode choices above (UNVERIFIED).
  REPORT_VA_IN_VSTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_VSTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_VSTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_VSTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_VSTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_VSTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_VSTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_VA_IN_VSTVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_VSTVAL_ON_STORE_AMO_PAGE_FAULT: true
  REPORT_VA_IN_VSTVAL_ON_INSTRUCTION_PAGE_FAULT: true
  REPORT_ENCODING_IN_VSTVAL_ON_ILLEGAL_INSTRUCTION: true
  REPORT_ENCODING_IN_VSTVAL_ON_VIRTUAL_INSTRUCTION: true   # UNVERIFIED
  # TRM: htval/mtval2 hold the faulting guest physical address (UNVERIFIED per case).
  REPORT_GPA_IN_HTVAL_ON_GUEST_PAGE_FAULT: true
  REPORT_GPA_IN_TVAL_ON_INSTRUCTION_GUEST_PAGE_FAULT: true
  REPORT_GPA_IN_TVAL_ON_LOAD_GUEST_PAGE_FAULT: true
  REPORT_GPA_IN_TVAL_ON_STORE_AMO_GUEST_PAGE_FAULT: true
  REPORT_GPA_IN_TVAL_ON_INTERMEDIATE_GUEST_PAGE_FAULT: true
  # tinst: TRM says "transformed" but not per cause. Zero is always legal; UNVERIFIED.
  TINST_VALUE_ON_BREAKPOINT: "always zero"
  TINST_VALUE_ON_FINAL_INSTRUCTION_GUEST_PAGE_FAULT: "always zero"
  TINST_VALUE_ON_FINAL_LOAD_GUEST_PAGE_FAULT: "always zero"
  TINST_VALUE_ON_FINAL_STORE_AMO_GUEST_PAGE_FAULT: "always zero"
  TINST_VALUE_ON_INSTRUCTION_ADDRESS_MISALIGNED: "always zero"
  TINST_VALUE_ON_LOAD_ACCESS_FAULT: "always zero"
  TINST_VALUE_ON_LOAD_ADDRESS_MISALIGNED: "always zero"
  TINST_VALUE_ON_LOAD_PAGE_FAULT: "always zero"
  TINST_VALUE_ON_MCALL: "always zero"
  TINST_VALUE_ON_SCALL: "always zero"
  TINST_VALUE_ON_STORE_AMO_ACCESS_FAULT: "always zero"
  TINST_VALUE_ON_STORE_AMO_ADDRESS_MISALIGNED: "always zero"
  TINST_VALUE_ON_STORE_AMO_PAGE_FAULT: "always zero"
  TINST_VALUE_ON_UCALL: "always zero"
  TINST_VALUE_ON_VIRTUAL_INSTRUCTION: "always zero"
  TINST_VALUE_ON_VSCALL: "always zero"

  # OpenSBI on Megrez: MHPM Info 4 (0x00000078) = mhpmcounter3-6.
  HPM_COUNTER_EN: [false, false, false, true, true, true, true, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false]
  # UNVERIFIED: counter width (OpenSBI measures it but does not print it).
  HPM_COUNTER3_WIDTH: 40
  HPM_COUNTER4_WIDTH: 40
  HPM_COUNTER5_WIDTH: 40
  HPM_COUNTER6_WIDTH: 40
  HPM_EVENTS: [0]
  # cycle, instret and mhpmcounter3-6 (inhibit for HPM3-6 UNVERIFIED).
  COUNTINHIBIT_EN: [true, false, true, true, true, true, true, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false]
  # HPM counters 3-6 implemented (OpenSBI MHPM mask 0x78).
  MCOUNTENABLE_EN: [false, false, false, true, true, true, true, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false]
