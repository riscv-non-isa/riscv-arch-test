# CI configuration for QEMU simulator
# Shared across all QEMU configs

ci_enabled: true
# Status as of QEMU v11.1.1:
# Sm: Multiple issues:
#     need H support in Sail
#     menvcfg.CBIE can be written with reserved 0b10 QEMU #4216
#     minstret one too high after wraparound (still fails with QEMU #4087 closed)
#     mcycleh write dropped (#4219)
#     mstatus.MPELP not writable (#4220)
# S:  sie mismatches on bit 13 (LCOFIE) https://gitlab.com/qemu-project/qemu/-/work_items/3969;
#     QEMU accepts UXL=1, which Sail cannot model yet (https://github.com/riscv/sail-riscv/issues/1150)
# Zacas: amocas with rd=x0 corrupts subsequent branch on x0 (https://gitlab.com/qemu-project/qemu/-/work_items/3526)
# InterruptsSm/InterruptsS: https://gitlab.com/qemu-project/qemu/-/work_items/3969 seems to apply to mip.LCOFIP not writable either
# ExceptionsZalrsc/ExceptionsSvZalrsc/ExceptionsSvZalrscSm: sc.w to no-permission region returns failure instead of raising
#        store/AMO access fault (https://gitlab.com/qemu-project/qemu/-/work_items/4100, still failing in v11.1.1)
# ExceptionsZicboU/S/Sm, SvZicbo: Zicbom CBOs skip PMA/PMP permission checks (https://gitlab.com/qemu-project/qemu/-/work_items/3501)
# ExceptionsZaamo/Zama16b: QEMU zama16b handling is incomplete: misaligned Zabha/Zacas AMOs fault,
#        but cross-granule word/doubleword AMOs execute instead of trapping
#        (https://gitlab.com/qemu-project/qemu/-/work_items/4101).
# SsstrictSm/SsstrictS/SsstrictU: Sail does not implement H, qemu#4200, qemu#4201
# TODO: Remove SsstrictV when sail SsstrictV is implemented
# Smstateen: mstateen0 bits are writable for state the hart lacks: P1P13 on RV64 and on RV32 without H
#     (https://gitlab.com/qemu-project/qemu/-/work_items/4495), and ENVCFG, CSRIND, AIA and IMSIC without S
#     (https://gitlab.com/qemu-project/qemu/-/work_items/4655). On the max configs CSRIND, AIA and IMSIC are
#     legally writable, but Sail does not model Sscsrind or Ssaia.
# Ssstateen (and Smstateen): on RV64, reserved bit 63 of sstateen1-3 is writable while mstateenN bit 63 is set,
#     but sstateen1-3 have no defined bits and must read zero (https://gitlab.com/qemu-project/qemu/-/work_items/4726).
# ZawrsU and ZawrsS fail on qemu due to stval mismatching, filed QEMU issue https://gitlab.com/qemu-project/qemu/-/work_items/4080
# Sdtrig*: QEMU's trigger implementation has too many problems (tdata1 writes of 0 ignored, reserved types abort, icount hangs: https://gitlab.com/qemu-project/qemu/-/work_items/4665); revisit when QEMU's Sdtrig matures.
# Sscofpmf*: qemu's mie write mask drops LCOFIE, so LCOFI is never taken: https://gitlab.com/qemu-project/qemu/-/work_items/3969
# H and every other hypervisor suite except ZicntrHSm, Shcounterenw, Shvstvecd, Shvsatpa and Shgatpa:
#    mstatus.MPV and GVA are read-only from M-mode (QEMU commit 18645f1957, v11.1.0), so mret
#    never enters VS/VU (https://gitlab.com/qemu-project/qemu/-/work_items/4588,
#    https://gitlab.com/qemu-project/qemu/-/issues/4620). QEMU 11.1.1 also:
#    - lets every vsstatus bit be written (https://gitlab.com/qemu-project/qemu/-/work_items/4589)
#    - keeps vsepc[0] (https://gitlab.com/qemu-project/qemu/-/work_items/4420)
#    - passes vsip bit 2 through to hvip.VSSIP (https://gitlab.com/qemu-project/qemu/-/work_items/4590)
#    - keeps hgatp.PPN[1:0] (https://gitlab.com/qemu-project/qemu/-/work_items/4591)
#    - ignores an hgatp write with an unsupported MODE, VMID and PPN included
#      (https://gitlab.com/qemu-project/qemu/-/work_items/4597)
#    - keeps the reserved henvcfg.CBIE = 0b10, as for menvcfg (https://gitlab.com/qemu-project/qemu/-/work_items/4216)
#    - makes hedeleg[19] read-only zero (https://gitlab.com/qemu-project/qemu/-/work_items/4592)
#    - drops hvip.VSTIP writes from M-mode while menvcfg.STCE = henvcfg.STCE = 1
#      (https://gitlab.com/qemu-project/qemu/-/work_items/4593)
#    - leaves mstatus.GVA = 0 on an HLV/HSV fault taken in M-mode
#      (https://gitlab.com/qemu-project/qemu/-/work_items/4594)
#    - raises instruction page faults instead of load page faults for HLVX
#      (https://gitlab.com/qemu-project/qemu/-/work_items/4595)
#    - raises virtual instead of illegal instruction for WFI in VU-mode with mstatus.TW = 1 (https://gitlab.com/qemu-project/qemu/-/work_items/4612)
#    - masks VS-mode reads of sie/sip with mideleg (https://gitlab.com/qemu-project/qemu/-/work_items/4613)
#    - lets VS-stage A/D updates write page tables the G-stage maps read-only (https://gitlab.com/qemu-project/qemu/-/work_items/4615)
#    - reports a PMP fault on a G-stage page-table read during a VS-stage walk as a guest-page fault
#      (https://gitlab.com/qemu-project/qemu/-/work_items/4616)
#    - on RV32, clears minstretcfgh on a minstretcfg write (https://gitlab.com/qemu-project/qemu/-/work_items/4617)
#    InterruptsHSm also needs a writable mip.LCOFIP (https://gitlab.com/qemu-project/qemu/-/work_items/3969).
#    qemu-rv32-max: the max CPU does not implement Zicfilp on RV32, so henvcfg.LPE is read-only zero.
# SsstateenH, SmstateenH: besides the VS/VU entry bug above, on RV32 a write to mstateen0 or hstateen0 clears
#    bits 63:62 of the 64-bit register (https://gitlab.com/qemu-project/qemu/-/work_items/4611), and VS/VU accesses to henvcfg or senvcfg
#    with mstateen0.ENVCFG = 0 raise virtual instead of illegal instruction (https://gitlab.com/qemu-project/qemu/-/work_items/4614).
# ZicfilpSm: an RV32 mstatus write clears mstatush.MPELP, so MRET does not restore ELP
#     (https://gitlab.com/qemu-project/qemu/-/work_items/4488), and mstatush.MPELP is not
#     writable (https://gitlab.com/qemu-project/qemu/-/work_items/4220).
# ZicfilpS, ZicfilpU: on RV32 a write to mstateen0 clears mstateen0h.ENVCFG
#     (https://gitlab.com/qemu-project/qemu/-/issues/4611). Boot writes mstateen0, so an
#     S-mode access to senvcfg then raises an illegal instruction (cause 2, xtval holding the
#     csrrc encoding) and the landing-pad tests diverge from the reference on senvcfg.LPE.
# All three suites pass on qemu-rv64-max, but exclusions apply to every QEMU config.
# Ssnpm,SsnpmSm,Smmpm,SmnpmS,SmnpmSSm,SmnpmU,SmnpmUSm : QEMU CBOs do not fault on inaccessible addresses in bare mode, shifting trap signatures;
# same issue as ExceptionsZicboU/S and SvZicbo (https://gitlab.com/qemu-project/qemu/-/work_items/3501).
# ZicntrSm/U fail on qemu because ecall, ebreak and illegal instruction increments minstret/instret. Filed QEMU issue: https://gitlab.com/qemu-project/qemu/-/work_items/4227
# ZicntrSm/U fail on qemu because minstret/instret overcounts by 1 for wfi with a pending or taken interrupt. Filed QEMU issue: https://gitlab.com/qemu-project/qemu/-/work_items/4230
exclude_extensions: "Sm,S,SsstrictSm,SsstrictS,SsstrictU,Zacas,InterruptsSm,InterruptsS,ExceptionsZalrsc,ExceptionsZicboU,ExceptionsZicboS,ExceptionsZicboSm,SvZicbo,ExceptionsZaamo,ExceptionsSvZalrsc,ExceptionsSvZalrscSm,Zama16b,SsstrictV,Smstateen,Ssstateen,ZawrsS,ZawrsU,SdtrigSm,SdtrigS,SdtrigU,SdtrigH,H,HSm,ExceptionsH,ExceptionsHSm,ExceptionsHF,ExceptionsHV,InterruptsH,InterruptsHSm,SstcH,SstcHSm,ZicntrH,SvinvalH,SvinvalHSm,Shvstvala,Shtvala,SvH,SvHSm,PMPH,SvHZicbo,SvHZicboSm,SmcntrpmfH,SsstateenH,SmstateenH,SsnpmH,ZicfilpH,ZicfilpSm,Ssnpm,SsnpmSm,Smmpm,SmnpmS,SmnpmSSm,SmnpmU,SmnpmUSm,ZicntrSm,ZicntrU,SscofpmfSm,SscofpmfS,SscofpmfU,ZicfilpS,ZicfilpU"
# qemu-rv32-mu, qemu-rv64-mu: U-mode cbo.zero/clean/flush/inval raise illegal-instruction without S-mode
#   because check_zicbo_envcfg() also requires senvcfg, which does not exist
#   (https://gitlab.com/qemu-project/qemu/-/work_items/4596)
# qemu-rv64-m, qemu-rv64-mu: mstatus.SXL/UXL read as 64-bit when S/U are not implemented
#   (https://gitlab.com/qemu-project/qemu/-/work_items/4456)
exclude_configs:
  - qemu-rv32-mu
  - qemu-rv64-m
  - qemu-rv64-mu
install_script: ".github/scripts/install-qemu.sh"
apt_packages: "libglib2.0-dev libfdt-dev libpixman-1-dev zlib1g-dev ninja-build"
shards: 1
config_shards:
  qemu-rv64-max: 2
  qemu-rv32-max: 2
  qemu-rv32-m: 2
