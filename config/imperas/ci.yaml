# CI configuration for Imperas simulator
# Imperas is proprietary and cannot run in public CI.

# These exclusions don't affect CI because it doesn't run, but they help tracking incomplete features.
# Items marked "fixed in Imperas-HMC101126-eng-build" apply to stock ImperasDV Y-2026.09 but pass with that engineering build of
# the Imperas RISC-V model (HMC's fixes for the Solvnet cases below; at HMC:
# export IMPERAS_VLNV=/proj/wally/imperas/Imperas-HMC101126-eng-build/lib/Linux64/ImperasLib), so they are commented out of
# exclude_extensions at the end of this file. Use the commented-out line when running stock Y-2026.09.
# - SsstrictSm/S/U: on the vector configs, Imperas does not enforce the vector register-group
#   overlap constraints, so it executes reserved widening encodings such as
#   vwmaccu.vv v14, v9, v15, v0.t instead of raising an illegal instruction:
#   https://solvnetplus.synopsys.com/s/case/500WQ0000230O4PYAU/imperas-treats-vwmaccuvv-v14-v9-v15-v0t-as-legal
#   imperas-rv32gcv also executed the draft Zvqmac encodings in VectorInstr-00/-03; that is worked around
#   in its imperas.ic (Zvqmac=F):
#   https://solvnetplus.synopsys.com/s/case/500WQ00002CEtKrYAL/the-vqmacc-draft-zvqmac-encodings-execute-on-named-v-variants-with-vectorversion10ratified
#   The VectorInstr tests are the only Ssstrict failures; rv32gck, which has no vector unit, passes all three.
#   Both issues are fixed in Imperas-HMC101126-eng-build.
# - SsstrictV passes on stock Y-2026.09 too, so it is no longer excluded.
# - Smstateen:
#   - imperas-rv64-max: Imperas lets mstateen0.P1P13 be written on RV64:
#     https://solvnetplus.synopsys.com/s/case/500WQ0000289tyxYAA/mstateen0p1p13-should-be-readonly-zero-on-rv64
#     (fixed in Imperas-HMC101126-eng-build)
#   - imperas-rv64-mu: Imperas implements scontext but keeps mstateen0.CONTEXT read-only zero (legal without
#     S-mode), which Sail cannot model yet (https://github.com/riscv/sail-riscv/issues/2013): with scontext off,
#     Sail traps M-mode scontext accesses; with it on, Sail makes CONTEXT writable. This keeps Smstateen excluded.
#   imperas-rv32gck and rv32gcv pass.
# - ExceptionsVx: https://solvnetplus.synopsys.com/s/case/500WQ000023l1CPYAY/vmvnrrv-does-not-raise-an-illegalinstruction-exception-when-vtypevill-1
#   (fixed in Imperas-HMC101126-eng-build)
# - SdtrigSm, SdtrigS, SdtrigU (stock only): an icount trigger that fires with action=0 writes the PC to xtval
#   instead of zero (norm:Sdtrig_icount_action0), so tests in which an icount trigger fires fail:
#   https://solvnetplus.synopsys.com/s/case/500WQ00002BsufNYAR/an-icount-trigger-that-fires-with-action0-writes-the-pc-to-mtval-instead-of-zero
#   (fixed in Imperas-HMC101126-eng-build). An itrigger on an interrupt sets tdata1.hit but takes no breakpoint
#   once the handler's code has run before, so SdtrigSm_Itrigger fails on imperas-rv64-max and imperas-rv32gck:
#   https://solvnetplus.synopsys.com/s/case/500WQ00002DmNGMYA3/itrigger-sets-tdata1hit-but-takes-no-breakpoint
#   (fixed in Imperas-HMC101126-eng-build). mcontext, hcontext and scontext are kept per trigger instead of once
#   per hart, so the Textra tests fail where textra context matching is claimed (imperas-rv32gck/gcv):
#   https://solvnetplus.synopsys.com/s/case/500WQ00002Dmex7YAB/sdtrig-mcontext-hcontext-and-scontext-are-kept-per-trigger-selected-by-tselect-instead-of-once-per-hart
#   (fixed in Imperas-HMC101126-eng-build). The imperas.ic files set amo_trigger=T, because AMOs must fire
#   load/store address triggers, and tcontrol_undefined=T, because Sail cannot model tcontrol with a delegable
#   medeleg[3].
# - PMPH: hlvx.hu/wu to a PMP region with R but not X succeeds (PMP must grant R and X):
#   https://solvnetplus.synopsys.com/s/case/500WQ000029sOnBYAU/hlvx-succeeds-to-a-pmp-region-that-allows-reads-but-not-execute
#   and a PMP-denied page-table read by hlvx raises an instruction access fault instead of a load access fault:
#   https://solvnetplus.synopsys.com/s/case/500WQ000029tEHDYA2/an-hlvx-pagetable-read-that-pmp-denies-raises-an-instruction-access-fault-instead-of-a-load-access-fault
#   (fixed in Imperas-HMC101126-eng-build)
# - SvH: hlvx with hstatus.SPVP = 1 and vsstatus.SUM = 1 faults on a VS-stage U = 1 page (SUM applies
#   to HLVX as to any guest load: https://github.com/riscv/riscv-isa-manual/issues/1480):
#   https://solvnetplus.synopsys.com/s/case/500WQ000029tzPeYAI/hlvx-with-spvp1-and-sum1-faults-on-a-vsstage-page-with-u1
#   and with henvcfg.ADUE = 1 a fetch through a VS leaf with A = 0 whose table is G-mapped read-only
#   completes instead of raising an instruction guest-page fault:
#   https://solvnetplus.synopsys.com/s/case/500WQ000029sv6VYAQ/with-adue1-a-fetch-whose-abit-update-targets-a-table-the-gstage-maps-readonly-completes-instead-of-faulting
#   (fixed in Imperas-HMC101126-eng-build)
# - SvHZicbo: a guest-page fault on the implicit VS-stage page-table read of a CBO writes the PTE's
#   guest physical address rounded down to its 64-byte cache block to htval instead of the PTE's address:
#   https://solvnetplus.synopsys.com/s/case/500WQ000029tFJcYAM/after-a-fault-on-an-implicit-pagetable-read-mtval2-holds-the-tables-base-address-instead-of-the-ptes-address
#   (fixed in Imperas-HMC101126-eng-build)
# - InterruptsH, SstcH, SstcHSm: csrrc/csrrs/csrrw return 0 in the old value for the delegated
#   read-only vsip.STIP/SEIP bits (csrr reads them correctly):
#   https://solvnetplus.synopsys.com/s/case/500WQ000029snvFYAQ/csrrccsrrscsrrw-return-0-as-the-old-value-of-vsipstipseip
#   (fixed in Imperas-HMC101126-eng-build)
# - SmstateenH: on RV64 the reserved bit 56 of hstateen0 is writable, like mstateen0.P1P13 above:
#   https://solvnetplus.synopsys.com/s/case/500WQ00002AccK6/hstateen0-bit-56-is-writable-on-rv64-but-it-is-reserved-wpri-in-hstateen0-and-must-be-readonly-zero
#   (fixed in Imperas-HMC101126-eng-build)
# - SsnpmH: HLV/HSV from U-mode with hstatus.SPVP = 0 take their pointer masking from senvcfg.PMM instead of
#   hstatus.HUPMM, and HLVX applies pointer masking, which it must not:
#   https://solvnetplus.synopsys.com/s/case/500WQ00002AdFZtYAN/hlvhsv-from-umode-with-hstatusspvp-0-take-senvcfgpmm-instead-of-hstatushupmm
#   https://solvnetplus.synopsys.com/s/case/500WQ00002AczdGYAR/hlvx-applies-pointer-masking
#   (fixed in Imperas-HMC101126-eng-build)
# - ZicfilpSm/ZicfilpS/ZicfilpH: MRET and SRET leave xPELP set instead of clearing it, for both yLPE=0 and
#   yLPE=1 (first failures mret_to_M_mlpe0_slpe0_ulpe0_pelp_1 and sret_to_S_slpe0_ulpe0_pelp_1).
#   norm:Zicfilp_pelp_trap_return requires xRET to set xPELP to NO_LP_EXPECTED unconditionally, and
#   Sail, Spike, Whisper and QEMU all clear it. ZicfilpU passes. ZicfilpH fails on the same bug
#   for an SRET executed in VS-mode (vsstatus.SPELP stays 1).
#   https://solvnetplus.synopsys.com/s/case/500WQ000029smeCYAQ/mretsret-do-not-set-mpelpspelp-to-nolpexpected
#   (fixed in Imperas-HMC101126-eng-build)
# - Svnapot: Imperas accepts N=1 on superpage leaf PTEs instead of page faulting
#   (validSvnapotEntry checks only for a leaf, not level 0, and fillTLBEntry skips the alignment check):
#   https://solvnetplus.synopsys.com/s/case/500WQ00002AsSN9YAN/svnapot-n1-accepted-on-superpage-leaf-ptes-instead-of-raising-a-page-fault
#   (fixed in Imperas-HMC101126-eng-build)
# - Zama16b is not declared. The model has no misaligned atomicity granule: Zam=T performs every
#   misaligned AMO, including SSAMOSWAP (riscv-isa-manual#3426), so the configs use Zam=F, where
#   misaligned AMOs, SSAMOSWAP and LR/SC raise store/AMO access faults.
# - Ssnpm, SsnpmSm, SmnpmS, SmnpmSSm (stock only): Imperas applies pointer masking when MXR is set:
#   https://solvnetplus.synopsys.com/s/case/500WQ000025qNCkYAM/pointer-masking-should-be-disabled-when-mxr1
#   (fixed in Imperas-HMC101126-eng-build). Smmpm, SmnpmU and SmnpmUSm pass on both. The xtval mismatches on
#   faulting addresses at or above 2^PHYS_ADDR_WIDTH were a Sail bug (https://github.com/riscv/sail-riscv/issues/1962),
#   fixed in Sail 0.16.
#
ci_enabled: false
# Stock ImperasDV Y-2026.09:
# exclude_extensions: "SsstrictSm,SsstrictS,SsstrictU,Smstateen,ExceptionsVx,SdtrigSm,SdtrigS,SdtrigU,PMPH,SvH,SvHZicbo,InterruptsH,SstcH,SstcHSm,SmstateenH,SsnpmH,ZicfilpSm,ZicfilpS,ZicfilpH,Svnapot,Ssnpm,SsnpmSm,SmnpmS,SmnpmSSm"
# Imperas-HMC101126-eng-build:
exclude_extensions: "Smstateen"
